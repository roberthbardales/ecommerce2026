{% extends 'base.html' %}

{% block content %}
<section class="section-conten padding-y" style="min-height:84vh">
    <div class="card mx-auto" style="max-width: 380px; margin-top:100px;">
        <div class="card-body">
            <h4 class="card-title mb-4">Restablecer contraseña</h4>
            {% include 'includes/alerts.html' %}
            <form action="{% url 'app_users:reset_password' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="Nueva contraseña" name="password">
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="Confirmar contraseña" name="confirm_password">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Restablecer</button>
                </div>
            </form>
        </div>
    </div>
    <p class="text-center mt-4">¿No tienes cuenta? <a href="{% url 'app_users:register' %}">Regístrate</a></p>
    <br><br>
</section>
{% endblock %}
