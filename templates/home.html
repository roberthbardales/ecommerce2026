{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section-intro padding-y-sm">
<div class="container">
    <div class="intro-banner-wrap">
        <img src="{% static 'images/banners/cover.jpg' %}" class="img-fluid rounded">
    </div>
</div>
</section>

<section class="section-name padding-y-sm">
<div class="container">
    <header class="section-heading">
        <a href="{% url 'app_store:store' %}" class="btn btn-outline-primary float-right">Ver todo</a>
        <h4 class="section-title">Productos populares</h4>
    </header>
    <div class="row">
        {% for product in products %}
        <div class="col-6 col-md-4 col-lg-3 mb-4">
            <div class="card product-card h-100 border-0 shadow-sm">
                <a href="{{ product.get_url }}" class="product-card__image">
                    <img src="{{ product.images.url }}" class="card-img-top" alt="{{ product.product_name }}">
                    <span class="product-card__badge">Popular</span>
                </a>
                <div class="card-body d-flex flex-column">
                    <a href="{{ product.get_url }}" class="product-card__title text-decoration-none">
                        {{ product.product_name }}
                    </a>
                    <div class="product-card__price mt-2">$ {{ product.price }}</div>
                    <div class="rating-star product-card__rating mt-2">
                        <span>
                            <i class="fa fa-star{% if product.averageReview < 0.5 %}-o{% elif product.averageReview >= 0.5 and product.averageReview < 1 %}-half-o{% endif %}" aria-hidden="true"></i>
                            <i class="fa fa-star{% if product.averageReview < 1.5 %}-o{% elif product.averageReview >= 1.5 and product.averageReview < 2 %}-half-o{% endif %}" aria-hidden="true"></i>
                            <i class="fa fa-star{% if product.averageReview < 2.5 %}-o{% elif product.averageReview >= 2.5 and product.averageReview < 3 %}-half-o{% endif %}" aria-hidden="true"></i>
                            <i class="fa fa-star{% if product.averageReview < 3.5 %}-o{% elif product.averageReview >= 3.5 and product.averageReview < 4 %}-half-o{% endif %}" aria-hidden="true"></i>
                            <i class="fa fa-star{% if product.averageReview < 4.5 %}-o{% elif product.averageReview >= 4.5 and product.averageReview < 5 %}-half-o{% endif %}" aria-hidden="true"></i>
                        </span>
                    </div>
                    <a href="{{ product.get_url }}" class="btn btn-outline-primary btn-sm mt-3 w-100">Ver producto</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</section>
{% endblock %}
